    <!-- Intercept and suppress preview environment Vite HMR WebSocket connection errors -->
    <script>
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var isViteHmr = 
              protocols === 'vite-hmr' || 
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('/@vite/') !== -1 || url.indexOf('vite-hmr') !== -1));

            if (isViteHmr) {
              var target = new EventTarget();
              target.url = String(url);
              target.protocol = 'vite-hmr';
              target.readyState = 1; // WebSocket.OPEN
              target.bufferedAmount = 0;
              target.binaryType = 'blob';
              target.send = function() {};
              target.close = function(code, reason) {
                target.readyState = 3;
                target.dispatchEvent(new Event('close'));
              };
              queueMicrotask(function() {
                target.dispatchEvent(new Event('open'));
              });
              return target;
            }
            return new NativeWebSocket(url, protocols);
          }
          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          window.WebSocket = MockViteWebSocket;
        }

        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || (event.error && event.error.message) || '') : '';
          var stack = event && event.error && event.error.stack ? event.error.stack : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || stack.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = event ? String(event.reason || (event.reason && event.reason.message) || '') : '';
          var stack = event && event.reason && event.reason.stack ? event.reason.stack : '';
          if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('@vite/client') !== -1 || stack.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
