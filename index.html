    <!-- Suppress benign preview environment WebSocket / HMR disconnection errors -->
    <script>
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.includes('WebSocket') || 
          event.message.includes('WebSocket closed') ||
          event.message.includes('@vite/client')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('WebSocket')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
